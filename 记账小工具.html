<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>花还是留？- 记账工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { background-color: #f7f7f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen relative overflow-x-hidden">

    <!-- 主页面：仪表盘与列表池 -->
    <div id="dashboard-view" class="max-w-md mx-auto p-4 pb-24 transition-all duration-300">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">我的小金库</h1>
            <div class="space-x-2">
                <button onclick="document.getElementById('importInput').click()" class="text-sm bg-gray-200 px-3 py-1 rounded-full">导入</button>
                <input type="file" id="importInput" class="hidden" accept=".json" onchange="importData(event)">
                <button onclick="exportData()" class="text-sm bg-gray-200 px-3 py-1 rounded-full">导出</button>
            </div>
        </div>

        <div class="bg-white rounded-3xl p-6 shadow-sm mb-6 relative">
            <div class="flex justify-between items-center mb-4">
                <select id="time-filter" onchange="renderDashboard()" class="bg-gray-100 rounded-lg px-3 py-1.5 text-sm outline-none font-medium text-gray-700">
                    <option value="all">全部时间</option>
                    <option value="day">今日</option>
                    <option value="week">本周</option>
                    <option value="month">本月</option>
                    <option value="year">本年</option>
                </select>
            </div>
            
            <div class="flex justify-between text-center mt-4">
                <div class="flex-1 flex flex-col items-center">
                    <div class="text-gray-500 text-xs mb-1">✨ 共省下</div>
                    <div id="total-saved" class="text-2xl font-bold text-green-600 mb-2">¥0.00</div>
                    <button onclick="generateShareImage('saved')" class="text-[10px] text-green-700 bg-green-50 px-3 py-1 rounded-full flex items-center shadow-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> 分享战果
                    </button>
                </div>
                <div class="w-px bg-gray-100 mx-2"></div>
                <div class="flex-1 flex flex-col items-center">
                    <div class="text-gray-500 text-xs mb-1">💸 忍痛花掉</div>
                    <div id="total-spent" class="text-2xl font-bold text-red-500 mb-2">¥0.00</div>
                    <button onclick="generateShareImage('spent')" class="text-[10px] text-red-700 bg-red-50 px-3 py-1 rounded-full flex items-center shadow-sm">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> 分享剁手
                    </button>
                </div>
            </div>
        </div>

        <h2 class="text-lg font-bold mb-3">明细记录</h2>
        <div id="record-list" class="space-y-3">
            <!-- 列表项通过JS渲染 -->
        </div>

        <!-- 悬浮添加按钮 -->
        <div class="fixed bottom-6 left-1/2 transform -translate-x-1/2 w-full max-w-md px-4">
            <button onclick="openAddItemView()" class="w-full bg-black text-white font-bold py-4 rounded-full shadow-lg text-lg flex justify-center items-center">
                <span class="text-2xl mr-2 leading-none">+</span> 记一笔
            </button>
        </div>
    </div>

    <!-- 子页面：决策与计算页面 -->
    <div id="detail-view" class="fixed inset-0 bg-[#f7f7f5] z-50 overflow-y-auto hidden">
        <div class="max-w-md mx-auto p-5 relative">
            <div class="flex justify-end pt-2 pb-6">
                <button onclick="closeAddItemView()" class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-sm font-medium">关闭</button>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold mb-2">这笔钱，花还是留？</h1>
                <p class="text-gray-500 text-sm">先看看花掉它意味着什么</p>
            </div>

            <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
                <div class="text-xs text-gray-400 mb-1">项目名称</div>
                <input type="text" id="item-name" placeholder="例如：Cybertruck" class="w-full text-xl font-medium outline-none" oninput="calculateCost()">
            </div>

            <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm flex items-center">
                <div class="w-full">
                    <div class="text-xs text-gray-400 mb-1">金额 (¥)</div>
                    <input type="number" id="item-amount" placeholder="0.00" class="w-full text-2xl font-bold outline-none" oninput="calculateCost()">
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
                <div class="text-xs text-gray-400 mb-1 flex justify-between">
                    <span>预期使用寿命 (年)</span>
                    <span class="text-xs text-gray-400">用于计算日均成本</span>
                </div>
                <input type="number" id="item-lifespan" value="1" placeholder="1" class="w-full text-lg outline-none" oninput="calculateCost()">
            </div>

            <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm">
                <div class="text-xs text-gray-400 mb-1">备注 (可选)</div>
                <input type="text" id="item-note" placeholder="为什么想买？" class="w-full text-base outline-none">
            </div>

            <div class="bg-white rounded-3xl p-5 mb-6 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg">如果花掉这笔钱</h3>
                    <span class="text-red-400 text-xl">💸</span>
                </div>
                <p class="text-xs text-gray-400 mb-4 border-b pb-2">按 <span id="display-lifespan">1</span> 年使用期折算支出</p>
                
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">每天</span>
                        <span id="cost-day" class="font-bold text-red-500">-¥0.00</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">每周</span>
                        <span id="cost-week" class="font-bold text-red-500">-¥0.00</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">每月</span>
                        <span id="cost-month" class="font-bold text-red-500">-¥0.00</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600">每年</span>
                        <span id="cost-year" class="font-bold text-red-500">-¥0.00</span>
                    </div>
                </div>
            </div>

            <div class="space-y-3 pb-8">
                <button onclick="saveRecord('saved')" class="w-full bg-[#346F4B] text-white font-bold py-4 rounded-2xl text-lg flex justify-center items-center shadow-md">
                    <span class="mr-2">✨</span> 省下它！
                </button>
                <button onclick="saveRecord('spent')" class="w-full bg-[#FCE6E6] text-[#D9534F] font-bold py-4 rounded-2xl text-lg shadow-sm">
                    忍痛花掉
                </button>
                <button id="delete-btn" onclick="deleteCurrentRecord()" class="w-full text-gray-400 text-sm mt-4 hidden underline">删除此记录</button>
            </div>
        </div>
    </div>

    <!-- 修复关键点：将隐藏模版移出屏幕外 (绝对定位 -9999px)，而不是设置透明度，保证 html2canvas 正常捕获 -->
    <div class="absolute top-[-9999px] left-[-9999px]">
        <div id="export-template" class="w-[320px] bg-white p-8 rounded-3xl text-center shadow-sm">
            <div id="export-emoji" class="text-7xl mb-6">😎</div>
            <div class="text-gray-500 text-sm font-medium mb-1">
                在 <span id="export-period" class="font-bold text-black">全部时间</span> 内
            </div>
            <div id="export-title" class="text-gray-800 text-xl font-bold mb-4">我成功省下了</div>
            <div id="export-amount" class="text-5xl font-extrabold text-green-600 mb-8 break-all">¥0.00</div>
            
            <div class="flex items-center justify-center border-t border-gray-100 pt-6">
                <div class="w-6 h-6 bg-black rounded-full mr-2 flex items-center justify-center text-white text-[10px] font-bold">💰</div>
                <span class="text-xs text-gray-400 font-bold tracking-widest uppercase">My Money Pool</span>
            </div>
        </div>
    </div>

    <!-- 生成图片的遮罩与展示区 -->
    <div id="image-overlay" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col items-center justify-center p-6">
        <p class="text-white/80 text-sm mb-6 tracking-wide">长按或右键保存分享图</p>
        
        <!-- 这里用于动态存放生成的图片 -->
        <img id="generated-image" class="rounded-2xl max-w-full max-h-[65vh] shadow-2xl object-contain" src="" alt="Share Image">
        
        <!-- 修复关键点：增加清晰的关闭返回按钮 -->
        <button onclick="closeShareOverlay()" class="mt-8 bg-white text-black px-10 py-3 rounded-full font-bold shadow-lg active:scale-95 transition-all">关闭返回</button>
    </div>

    <script>
        let records = JSON.parse(localStorage.getItem('moneyPoolRecords')) || [];
        let editingId = null;

        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
        });

        function saveToLocal() {
            localStorage.setItem('moneyPoolRecords', JSON.stringify(records));
        }

        function openAddItemView(id = null) {
            editingId = id;
            document.getElementById('dashboard-view').style.display = 'none';
            const detailView = document.getElementById('detail-view');
            detailView.classList.remove('hidden');
            
            if (id) {
                const record = records.find(r => r.id === id);
                document.getElementById('item-name').value = record.name;
                document.getElementById('item-amount').value = record.amount;
                document.getElementById('item-lifespan').value = record.lifespan || 1;
                document.getElementById('item-note').value = record.note || '';
                document.getElementById('delete-btn').classList.remove('hidden');
            } else {
                document.getElementById('item-name').value = '';
                document.getElementById('item-amount').value = '';
                document.getElementById('item-lifespan').value = '1';
                document.getElementById('item-note').value = '';
                document.getElementById('delete-btn').classList.add('hidden');
            }
            calculateCost();
        }

        function closeAddItemView() {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('dashboard-view').style.display = 'block';
            editingId = null;
            renderDashboard();
        }

        function calculateCost() {
            const amount = parseFloat(document.getElementById('item-amount').value) || 0;
            const lifespan = parseFloat(document.getElementById('item-lifespan').value) || 1;
            
            document.getElementById('display-lifespan').innerText = lifespan;

            const yearly = amount / lifespan;
            const monthly = yearly / 12;
            const weekly = yearly / 52.14; 
            const daily = yearly / 365;

            document.getElementById('cost-year').innerText = `-¥${yearly.toFixed(2)}`;
            document.getElementById('cost-month').innerText = `-¥${monthly.toFixed(2)}`;
            document.getElementById('cost-week').innerText = `-¥${weekly.toFixed(2)}`;
            document.getElementById('cost-day').innerText = `-¥${daily.toFixed(2)}`;
        }

        function saveRecord(type) {
            const name = document.getElementById('item-name').value.trim();
            const amount = parseFloat(document.getElementById('item-amount').value);
            const lifespan = document.getElementById('item-lifespan').value;
            const note = document.getElementById('item-note').value.trim();

            if (!name || isNaN(amount) || amount <= 0) {
                alert('请填写有效的名称和金额');
                return;
            }

            const record = {
                id: editingId || Date.now().toString(),
                type: type,
                name: name,
                amount: amount,
                lifespan: lifespan,
                note: note,
                timestamp: editingId ? records.find(r=>r.id === editingId).timestamp : Date.now()
            };

            if (editingId) {
                const index = records.findIndex(r => r.id === editingId);
                records[index] = record;
            } else {
                records.unshift(record);
            }

            saveToLocal();
            closeAddItemView();
        }

        function deleteCurrentRecord() {
            if(confirm('确定要删除这笔记录吗？')) {
                records = records.filter(r => r.id !== editingId);
                saveToLocal();
                closeAddItemView();
            }
        }

        function isWithinFilter(timestamp, filter) {
            if (filter === 'all') return true;
            const date = new Date(timestamp);
            const now = new Date();
            
            if (filter === 'day') {
                return date.toDateString() === now.toDateString();
            } else if (filter === 'week') {
                const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
                startOfWeek.setHours(0,0,0,0);
                return date >= startOfWeek;
            } else if (filter === 'month') {
                return date.getMonth() === now.getMonth() && date.getFullYear() === now.getFullYear();
            } else if (filter === 'year') {
                return date.getFullYear() === now.getFullYear();
            }
            return true;
        }

        function renderDashboard() {
            const filter = document.getElementById('time-filter').value;
            let totalSaved = 0;
            let totalSpent = 0;
            const listContainer = document.getElementById('record-list');
            listContainer.innerHTML = '';

            const filteredRecords = records.filter(r => isWithinFilter(r.timestamp, filter));

            if(filteredRecords.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-gray-400 py-8 text-sm">暂无记录，点击下方记一笔吧</div>';
            }

            filteredRecords.forEach(record => {
                if (record.type === 'saved') totalSaved += record.amount;
                if (record.type === 'spent') totalSpent += record.amount;

                const dateStr = new Date(record.timestamp).toLocaleDateString('zh-CN', {month:'short', day:'numeric'});
                const isSaved = record.type === 'saved';
                const typeText = isSaved ? '✨ 省下' : '💸 花掉';
                const colorClass = isSaved ? 'text-green-600 bg-green-50' : 'text-red-500 bg-red-50';
                const amountSign = isSaved ? '+' : '-';

                const div = document.createElement('div');
                div.className = 'bg-white rounded-2xl p-4 shadow-sm flex justify-between items-center cursor-pointer hover:bg-gray-50';
                div.onclick = () => openAddItemView(record.id);
                div.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="px-2 py-1 rounded-lg text-xs font-bold whitespace-nowrap ${colorClass}">${typeText}</div>
                        <div class="truncate">
                            <div class="font-bold text-gray-800 truncate">${record.name}</div>
                            <div class="text-xs text-gray-400">${dateStr} ${record.note ? '· '+record.note : ''}</div>
                        </div>
                    </div>
                    <div class="font-bold text-lg ${isSaved ? 'text-green-600' : 'text-gray-800'}">
                        ${amountSign}¥${record.amount.toLocaleString()}
                    </div>
                `;
                listContainer.appendChild(div);
            });

            document.getElementById('total-saved').innerText = `¥${totalSaved.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('total-spent').innerText = `¥${totalSpent.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function exportData() {
            const dataStr = JSON.stringify(records, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `小金库备份_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        records = imported;
                        saveToLocal();
                        renderDashboard();
                        alert('数据导入成功！');
                    }
                } catch (error) {
                    alert('数据格式不正确，导入失败。');
                }
            };
            reader.readAsText(file);
        }

        function generateShareImage(type) {
            const template = document.getElementById('export-template');
            const selectEl = document.getElementById('time-filter');
            const periodText = selectEl.options[selectEl.selectedIndex].text;
            
            // 填充文案和颜色
            document.getElementById('export-period').innerText = periodText;

            if (type === 'saved') {
                document.getElementById('export-emoji').innerText = '😎';
                document.getElementById('export-title').innerText = '我成功省下了';
                document.getElementById('export-amount').innerText = document.getElementById('total-saved').innerText;
                document.getElementById('export-amount').className = 'text-5xl font-extrabold text-green-600 mb-8 break-all';
            } else {
                document.getElementById('export-emoji').innerText = '🥲';
                document.getElementById('export-title').innerText = '我忍痛花掉了';
                document.getElementById('export-amount').innerText = document.getElementById('total-spent').innerText;
                document.getElementById('export-amount').className = 'text-5xl font-extrabold text-red-500 mb-8 break-all';
            }

            // 打开遮罩并清空旧图
            const overlay = document.getElementById('image-overlay');
            overlay.classList.remove('hidden');
            overlay.style.display = 'flex';
            document.getElementById('generated-image').src = ''; 

            // 给 DOM 一点时间更新文字，再开始截图
            setTimeout(() => {
                html2canvas(template, {
                    scale: 3, 
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    const imgData = canvas.toDataURL('image/png');
                    document.getElementById('generated-image').src = imgData;
                });
            }, 100);
        }

        function closeShareOverlay() {
            const overlay = document.getElementById('image-overlay');
            overlay.classList.add('hidden');
            overlay.style.display = 'none';
        }
    </script>
</body>
</html>
